---
schemaVersion: 1.0.0
name: tre-shared-service-guacamole
version: 0.3.0
description: "A shared Apache Guacamole service for Azure TRE supporting multiple workspaces"
dockerfile: Dockerfile.tmpl
registry: azuretre

custom:
  runtime_image:
    name: guac-server-shared
    build:
      version_file: guacamole-server/docker/version.txt
      docker_file: guacamole-server/docker/Dockerfile
      docker_context: guacamole-server

credentials:
  - name: azure_tenant_id
    env: ARM_TENANT_ID
  - name: azure_subscription_id
    env: ARM_SUBSCRIPTION_ID
  - name: azure_client_id
    env: ARM_CLIENT_ID
  - name: azure_client_secret
    env: ARM_CLIENT_SECRET

parameters:
  - name: tre_id
    type: string
    description: "The ID of the parent TRE instance e.g., mytre-dev-3142"
  - name: image_tag
    type: string
    default: "" # will use the value in the version.txt file unless provided
    description: "The tag of the guacamole image"
  - name: mgmt_acr_name
    type: string
    env: mgmt_acr_name
    description: "The devops ACR name"
  - name: mgmt_resource_group_name
    type: string
    description: "Resource group containing the devops ACR"
    env: MGMT_RESOURCE_GROUP_NAME
  # the following are added automatically by the resource processor
  - name: id
    type: string
    description: "An Id for this installation"
    env: id
  - name: tfstate_resource_group_name
    type: string
    description: "Resource group containing the Terraform state storage account"
  - name: tfstate_storage_account_name
    type: string
    description: "The name of the Terraform state storage account"
  - name: tfstate_container_name
    env: tfstate_container_name
    type: string
    default: "tfstate"
    description: "The name of the Terraform state storage container"
  - name: arm_use_msi
    env: ARM_USE_MSI
    type: boolean
    default: false
  - name: arm_environment
    type: string
  - name: aad_authority_url
    type: string
    default: "https://login.microsoftonline.com"
    description: "The Azure AD authority URL"

outputs:
  - name: connection_uri
    type: string
    applyTo:
      - install
      - upgrade
  - name: is_exposed_externally
    type: boolean
    applyTo:
      - install
      - upgrade

mixins:
  - terraform:
      clientVersion: 1.9.8

install:
  - terraform:
      description: "Deploy Shared Guacamole Service"
      vars:
        tre_id: ${ bundle.parameters.tre_id }
        image_name: ${ bundle.custom.runtime_image.name }
        image_tag: ${ bundle.parameters.image_tag }
        mgmt_acr_name: ${ bundle.parameters.mgmt_acr_name }
        mgmt_resource_group_name: ${ bundle.parameters.mgmt_resource_group_name }
        tre_resource_id: ${ bundle.parameters.id }
        arm_environment: ${ bundle.parameters.arm_environment }
        aad_authority_url: ${ bundle.parameters.aad_authority_url }
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: ${ bundle.parameters.tre_id }-shared-service-guacamole
      outputs:
        - name: connection_uri
        - name: is_exposed_externally

upgrade:
  - terraform:
      description: "Upgrade Shared Guacamole Service"
      vars:
        tre_id: ${ bundle.parameters.tre_id }
        image_name: ${ bundle.custom.runtime_image.name }
        image_tag: ${ bundle.parameters.image_tag }
        mgmt_acr_name: ${ bundle.parameters.mgmt_acr_name }
        mgmt_resource_group_name: ${ bundle.parameters.mgmt_resource_group_name }
        tre_resource_id: ${ bundle.parameters.id }
        arm_environment: ${ bundle.parameters.arm_environment }
        aad_authority_url: ${ bundle.parameters.aad_authority_url }
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: ${ bundle.parameters.tre_id }-shared-service-guacamole
      outputs:
        - name: connection_uri
        - name: is_exposed_externally

uninstall:
  - terraform:
      description: "Delete the Shared Guacamole Service"
      vars:
        tre_id: ${ bundle.parameters.tre_id }
        image_name: ${ bundle.custom.runtime_image.name }
        image_tag: ${ bundle.parameters.image_tag }
        mgmt_acr_name: ${ bundle.parameters.mgmt_acr_name }
        mgmt_resource_group_name: ${ bundle.parameters.mgmt_resource_group_name }
        tre_resource_id: ${ bundle.parameters.id }
        arm_environment: ${ bundle.parameters.arm_environment }
        aad_authority_url: ${ bundle.parameters.aad_authority_url }
      backendConfig:
        use_azuread_auth: "true"
        use_oidc: "true"
        resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
        storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
        container_name: ${ bundle.parameters.tfstate_container_name }
        key: ${ bundle.parameters.tre_id }-shared-service-guacamole
