---
schemaVersion: 1.0.0
name: tre-workspace-service-nextflow
version: 0.3.2
description: 'A Nextflow workspace service: a web portal that runs Nextflow pipelines on Azure Batch inside the workspace'
dockerfile: Dockerfile.tmpl
registry: azuretre
custom:
  runtime_image:
    name: nextflow-workspace-service
    build:
      version_file: version.txt
      docker_file: app/Dockerfile
      docker_context: app
credentials:
- name: azure_tenant_id
  env: ARM_TENANT_ID
- name: azure_subscription_id
  env: ARM_SUBSCRIPTION_ID
- name: azure_client_id
  env: ARM_CLIENT_ID
- name: azure_client_secret
  env: ARM_CLIENT_SECRET
  sensitive: true
parameters:
- name: workspace_id
  type: string
- name: tre_id
  type: string
- name: mgmt_acr_name
  type: string
  env: mgmt_acr_name
  description: The devops ACR name
- name: mgmt_resource_group_name
  type: string
  env: MGMT_RESOURCE_GROUP_NAME
  description: Resource group containing the devops ACR
- name: id
  type: string
  env: id
  description: An Id for this installation
- name: tfstate_resource_group_name
  type: string
  description: Resource group containing the Terraform state storage account
- name: tfstate_storage_account_name
  type: string
  description: The name of the Terraform state storage account
- name: tfstate_container_name
  env: tfstate_container_name
  type: string
  default: tfstate
  description: The name of the Terraform state storage container
- name: arm_use_msi
  env: ARM_USE_MSI
  type: boolean
  default: false
- name: arm_environment
  env: ARM_ENVIRONMENT
  type: string
  default: public
- name: aad_authority_url
  type: string
  default: https://login.microsoftonline.com
- name: display_name
  type: string
  default: Nextflow
- name: address_space
  type: string
  description: Address space for the Batch pool subnet
- name: head_vm_size
  type: string
  default: Standard_D2s_v3
- name: head_max_nodes
  type: integer
  default: 2
- name: worker_vm_size
  type: string
  default: Standard_D4s_v3
- name: worker_max_nodes
  type: integer
  default: 4
- name: worker_use_spot
  type: boolean
  default: false
- name: work_retention_days
  type: integer
  default: 14
mixins:
- exec
- terraform:
    clientVersion: 1.9.8
outputs:
- name: connection_uri
  type: string
  applyTo:
  - install
  - upgrade
- name: authentication_callback_uri
  type: string
  applyTo:
  - install
  - upgrade
- name: auth_source_addresses
  type: string
  applyTo:
  - install
  - upgrade
install:
- terraform:
    description: Deploy Nextflow workspace service
    vars:
      workspace_id: ${ bundle.parameters.workspace_id }
      tre_id: ${ bundle.parameters.tre_id }
      id: ${ bundle.parameters.id }
      mgmt_acr_name: ${ bundle.parameters.mgmt_acr_name }
      mgmt_resource_group_name: ${ bundle.parameters.mgmt_resource_group_name }
      aad_authority_url: ${ bundle.parameters.aad_authority_url }
      arm_environment: ${ bundle.parameters.arm_environment }
      display_name: ${ bundle.parameters.display_name }
      address_space: ${ bundle.parameters.address_space }
      head_vm_size: ${ bundle.parameters.head_vm_size }
      head_max_nodes: ${ bundle.parameters.head_max_nodes }
      worker_vm_size: ${ bundle.parameters.worker_vm_size }
      worker_max_nodes: ${ bundle.parameters.worker_max_nodes }
      worker_use_spot: ${ bundle.parameters.worker_use_spot }
      work_retention_days: ${ bundle.parameters.work_retention_days }
    backendConfig:
      use_azuread_auth: 'true'
      use_oidc: 'true'
      resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
      storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
      container_name: ${ bundle.parameters.tfstate_container_name }
      key: tre-workspace-service-nextflow-${ bundle.parameters.id }
    outputs:
    - name: connection_uri
    - name: authentication_callback_uri
    - name: auth_source_addresses
upgrade:
- terraform:
    description: Upgrade Nextflow workspace service
    vars:
      workspace_id: ${ bundle.parameters.workspace_id }
      tre_id: ${ bundle.parameters.tre_id }
      id: ${ bundle.parameters.id }
      mgmt_acr_name: ${ bundle.parameters.mgmt_acr_name }
      mgmt_resource_group_name: ${ bundle.parameters.mgmt_resource_group_name }
      aad_authority_url: ${ bundle.parameters.aad_authority_url }
      arm_environment: ${ bundle.parameters.arm_environment }
      display_name: ${ bundle.parameters.display_name }
      address_space: ${ bundle.parameters.address_space }
      head_vm_size: ${ bundle.parameters.head_vm_size }
      head_max_nodes: ${ bundle.parameters.head_max_nodes }
      worker_vm_size: ${ bundle.parameters.worker_vm_size }
      worker_max_nodes: ${ bundle.parameters.worker_max_nodes }
      worker_use_spot: ${ bundle.parameters.worker_use_spot }
      work_retention_days: ${ bundle.parameters.work_retention_days }
    backendConfig:
      use_azuread_auth: 'true'
      use_oidc: 'true'
      resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
      storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
      container_name: ${ bundle.parameters.tfstate_container_name }
      key: tre-workspace-service-nextflow-${ bundle.parameters.id }
    outputs:
    - name: connection_uri
    - name: authentication_callback_uri
    - name: auth_source_addresses
uninstall:
- terraform:
    description: Uninstall Nextflow workspace service
    vars:
      workspace_id: ${ bundle.parameters.workspace_id }
      tre_id: ${ bundle.parameters.tre_id }
      id: ${ bundle.parameters.id }
      mgmt_acr_name: ${ bundle.parameters.mgmt_acr_name }
      mgmt_resource_group_name: ${ bundle.parameters.mgmt_resource_group_name }
      aad_authority_url: ${ bundle.parameters.aad_authority_url }
      arm_environment: ${ bundle.parameters.arm_environment }
      display_name: ${ bundle.parameters.display_name }
      address_space: ${ bundle.parameters.address_space }
      head_vm_size: ${ bundle.parameters.head_vm_size }
      head_max_nodes: ${ bundle.parameters.head_max_nodes }
      worker_vm_size: ${ bundle.parameters.worker_vm_size }
      worker_max_nodes: ${ bundle.parameters.worker_max_nodes }
      worker_use_spot: ${ bundle.parameters.worker_use_spot }
      work_retention_days: ${ bundle.parameters.work_retention_days }
    backendConfig:
      use_azuread_auth: 'true'
      use_oidc: 'true'
      resource_group_name: ${ bundle.parameters.tfstate_resource_group_name }
      storage_account_name: ${ bundle.parameters.tfstate_storage_account_name }
      container_name: ${ bundle.parameters.tfstate_container_name }
      key: tre-workspace-service-nextflow-${ bundle.parameters.id }
